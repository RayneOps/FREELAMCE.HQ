<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Usman — Web Design &amp; Development</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14130F">
  <!-- Self-contained on purpose: hosts serve this file at any missing URL,
       so it must not depend on relative CSS or image paths. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314130F'/%3E%3Cpath d='M10 8v9a6 6 0 0 0 12 0V8' fill='none' stroke='%23F4F1EA' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f1ea; color: #34322c; }
    main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem 1rem; }
    .code { font-size: clamp(6rem, 22vw, 13rem); font-weight: 800; letter-spacing: -0.06em; line-height: .9; color: #14130f; margin: 0; }
    .code span { color: #e0481b; }
    h1 { color: #14130f; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.02em; margin: 1rem 0 .5rem; }
    p { color: #615d54; max-width: 40ch; margin: 0 auto 2rem; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    a { display: inline-flex; align-items: center; min-height: 46px; padding: .7rem 1.3rem; border-radius: 999px; font-weight: 600; text-decoration: none; border: 1.5px solid #14130f; color: #14130f; }
    a.primary { background: #14130f; color: #f4f1ea; }
    a:focus-visible { outline: 3px solid #e0481b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="code" aria-hidden="true">4<span>0</span>4</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be broken or the page may have moved. Let’s get you back on track.</p>
      <div class="actions">
        <a class="primary" href="/" data-home>Go to homepage</a>
        <a href="/#work" data-home-work>See my work</a>
      </div>
    </div>
  </main>
  <script>
    // On GitHub Pages project sites (user.github.io/repo/) send visitors to the repo folder.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      if (location.hostname.slice(-10) === '.github.io' && parts.length) {
        var base = '/' + parts[0] + '/';
        document.querySelector('[data-home]').href = base;
        document.querySelector('[data-home-work]').href = base + '#work';
      }
    })();
  </script>
</body>
</html>
